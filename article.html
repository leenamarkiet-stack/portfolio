<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Case Study — Leena Markiet</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap">
<script src="config.js"></script>
<style>
  :root { --cream:#F7EBDC; --yellowBloom:#FBEFC6; --tanBloom:#F5E1C3;
    --lilac:#E9E6F8; --stem:#7C8C6E; --stemDeep:#546B41; --stemDark:#33452A;
    --sage:#C3CC9B; --forest:#546B41; --ink:#1F1A14; --paper:#FFFAF0; }
  *,*::before,*::after { box-sizing: border-box; }
  html, body { margin:0; padding:0; background: var(--cream); color: var(--ink);
    font-family: Inter, system-ui, sans-serif; }
  img { display: block; max-width: 100%; height: auto; }

  @keyframes blob1 { 0%,100%{transform:translate(0,0) scale(1);} 33%{transform:translate(-60px,30px) scale(1.1);} 66%{transform:translate(40px,-20px) scale(0.95);} }
  @keyframes blob2 { 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(60px,40px) scale(1.1);} }
  .blob-a { animation: blob1 22s ease-in-out infinite; }
  .blob-b { animation: blob2 26s ease-in-out infinite; }

  /* Header */
  .hd { padding:14px 48px; position:sticky; top:0; z-index:100;
    background:rgba(247,235,220,0.92); backdrop-filter:blur(8px);
    border-bottom:1px solid rgba(0,0,0,0.08);
    display:flex; justify-content:space-between; align-items:center; gap:12px; }
  .hd a { color: var(--forest); text-decoration:none; font-size:11px;
    letter-spacing:0.1em; text-transform:uppercase; }
  .hd a:hover { color: var(--ink); }

  .container { max-width: 1240px; margin: 0 auto; }

  /* Hero */
  .hero { padding:48px 64px 36px;
    background: linear-gradient(135deg, var(--cream) 0%, var(--yellowBloom) 55%, var(--tanBloom) 100%);
    position:relative; }
  /* Blobs keep their own clipping layer so the hero can stay overflow-visible
     and let the art hang past the band into the section below. */
  .hero-blobs { position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:0; }
  .hero-content { position:relative; max-width:760px; }
  /* Two columns when the case study has a hero image: text left, art right.
     Falls back to a single column when there is no image. */
  .hero-inner { position:relative; z-index:1; display:grid; gap:44px; align-items:center;
    grid-template-columns: minmax(0,1.1fr) minmax(0,0.9fr); }
  .hero-inner.no-art { grid-template-columns: 1fr; }
  .hero-inner .hero-content { max-width:none; }
  .hero-tags { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:18px; }
  .hero-tag { font-size:11px; padding:4px 10px; border-radius:999px;
    background:rgba(255,250,240,0.85); color: var(--ink); font-weight:500; }
  .hero-h1 { font-family:'Playfair Display',Georgia,serif; font-weight:400;
    font-size:52px; line-height:1.05; letter-spacing:-0.02em; margin:0; color: var(--ink); }
  .hero-overview { margin:18px 0 0; font-size:16px; line-height:1.55; color: var(--ink); max-width:640px; }
  .meta-grid { margin-top:28px; display:grid;
    grid-template-columns:repeat(auto-fit,minmax(104px,1fr)); gap:14px;
    padding-top:18px; border-top:1px dashed rgba(31,26,20,0.25); }
  .meta-k { font-size:10px; letter-spacing:0.1em; color: var(--forest);
    text-transform:uppercase; margin-bottom:2px; }
  .meta-v { font-size:13px; color: var(--ink); }

  /* Hero image (optional) — sits in the hero's right column.
     contain, not cover: hero art is often a transparent PNG that should be
     shown whole, with the page fill visible behind it rather than cropped. */
  .hero-img { aspect-ratio: 4/3; max-height: 460px; width:100%;
    cursor:zoom-in; position:relative; z-index:2;
    margin-bottom:-74px; }
  .hero-img img { width:100%; height:100%; object-fit:contain;
    filter: drop-shadow(0 14px 28px rgba(31,26,20,0.16)); }

  /* Body */
  .body { padding: 56px 64px 80px; }

  /* Section */
  .section { margin-bottom: 64px; }
  .section-head { display:flex; align-items:baseline; gap:14px; margin-bottom: 14px; }
  .section-num { font-size:11px; letter-spacing:0.1em; font-weight:600;
    background: linear-gradient(135deg, var(--stem), var(--stemDeep), var(--stemDark));
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .section-h2 { font-family:'Playfair Display',Georgia,serif; font-weight:400;
    font-size:28px; letter-spacing:-0.01em; margin:0; color: var(--ink); }
  .section-body { font-size:15px; line-height:1.65; color:#3A332C; max-width:640px;
    margin: 0 0 18px; white-space: pre-wrap; }
  .section-list { font-size:15px; line-height:1.55; color:#3A332C; max-width:640px;
    margin: 0 0 18px; padding-left: 20px; }
  .section-list li { margin: 0 0 7px; padding-left: 2px; }
  .section-list li::marker { color: var(--stem); }
  .section-list li:last-child { margin-bottom: 0; }

  /* Layouts */
  .layout-media { display:grid; gap:28px; align-items:start; }
  .layout-media-left  { grid-template-columns: minmax(0, 1.25fr) minmax(0, 0.85fr); }
  .layout-media-right { grid-template-columns: minmax(0, 0.85fr) minmax(0, 1.25fr); }
  /* No fixed aspect: case study art ranges from tall phone mock-ups to wide
     tables, and a fixed frame letterboxes one or the other. */
  .main-image-wrap { position:relative; max-height: 620px;
    border-radius:8px; overflow:hidden; border:1px solid rgba(0,0,0,0.08);
    background:var(--plate, var(--paper)); cursor:zoom-in; transition: transform .2s ease; }
  .main-image-wrap:hover { transform: translateY(-2px); box-shadow: 0 14px 30px -16px rgba(0,0,0,0.3); }
  .main-image-wrap img { display:block; width:100%; height:auto;
    max-height:620px; object-fit:contain; }
  .main-image-cap { font-size:11px; color: var(--forest); margin-top:6px;
    letter-spacing:0.04em; }

  /* Smaller image grid */
  .extra-grid { display:grid; grid-template-columns: repeat(3, 1fr); gap:16px; margin-top: 24px; }
  .extra-item { display:flex; flex-direction:column; gap:6px; }
  .extra-thumb { aspect-ratio: 4/3; max-height: 240px; border-radius:6px; overflow:hidden;
    border:1px solid rgba(0,0,0,0.08); background:var(--plate, var(--paper));
    cursor:zoom-in; transition: transform .2s ease; }
  .extra-thumb:hover { transform: translateY(-2px); box-shadow: 0 10px 22px -14px rgba(0,0,0,0.3); }
  .extra-thumb img { width:100%; height:100%; object-fit:contain; }
  .extra-cap { font-size:11px; color: var(--forest); letter-spacing:0.02em; line-height:1.35; }

  .gallery-grid { display:grid; grid-template-columns: repeat(3,1fr); gap:14px; }

  /* Outro */
  .outro { padding-top:24px; border-top:1px solid rgba(0,0,0,0.12);
    display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap; }
  .outro-end { font-size:11px; letter-spacing:0.08em; color:#5C544A; text-transform:uppercase; }
  .cta { font-size:13px; font-weight:500; padding:10px 18px; border-radius:999px;
    background: linear-gradient(135deg, var(--stem), var(--stemDeep)); color: var(--paper);
    text-decoration:none; box-shadow:0 8px 20px -8px rgba(84,107,65,0.45); }

  /* Related projects */
  .related { padding: 56px 0 0; }
  .related-head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:18px; gap:14px; }
  .related-h2 { font-family:'Playfair Display',Georgia,serif; font-weight:400; font-size:28px;
    letter-spacing:-0.01em; margin:0; color: var(--ink); }
  .related-link { font-size:11px; letter-spacing:0.08em; color: var(--forest);
    text-transform:uppercase; text-decoration:none; }
  .related-link:hover { color: var(--ink); }
  .related-grid { display:grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .related-card { background: var(--paper); border:1px solid rgba(31,26,20,0.07);
    border-radius:8px; overflow:hidden; cursor:pointer; text-decoration:none; color: inherit;
    display:flex; flex-direction:column;
    transition: transform .18s ease, box-shadow .18s ease; }
  .related-card:hover { transform: translateY(-3px);
    box-shadow: 0 18px 36px -16px rgba(31,26,20,0.25); }
  .related-cover { aspect-ratio: 4/3; position: relative; overflow:hidden; }
  .related-cover img { width:100%; height:100%; object-fit: cover; }
  .related-cover .ph-gr { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  .related-cover .ph-gr span { font-size:10.5px; letter-spacing:0.08em; color: var(--ink);
    text-transform:uppercase; padding:5px 11px; border-radius:999px; background:rgba(255,250,240,0.85); }
  .related-cover .ph-yr {
    position:absolute; top:8px; right:8px;
    font-size:10px; font-weight:500; padding:3px 8px; border-radius:999px;
    color: var(--paper); background: linear-gradient(135deg, var(--stem), var(--stemDeep));
  }
  .related-body { padding: 12px 14px 14px; display:flex; flex-direction:column; gap:6px; flex:1; }
  .related-title { font-family:'Playfair Display',Georgia,serif; font-weight:400;
    font-size:18px; line-height:1.2; margin:0; color: var(--ink); }
  .related-tags { display:flex; flex-wrap:wrap; gap:4px; margin-top:auto; padding-top:6px; }
  .related-tag { font-size:10.5px; padding:2px 8px; border-radius:4px;
    background: rgba(195,204,155,0.45); color: var(--forest); font-weight:500; }

  /* Placeholder */
  .ph { width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
  .ph span { font-size:10px; letter-spacing:0.08em; text-transform:uppercase;
    color:rgba(255,255,255,0.92); padding:5px 10px; border-radius:999px;
    background: rgba(0,0,0,0.18); }

  /* Lightbox */
  .lb { position:fixed; inset:0; background: rgba(0,0,0,0.92); z-index:9999;
    display:none; align-items:center; justify-content:center; padding:24px; cursor:zoom-out; }
  .lb.show { display:flex; }
  .lb img { width:96vw; height:92vh; object-fit:contain; border-radius:6px; }
  .lb-cap { position:absolute; bottom:18px; left:50%; transform:translateX(-50%);
    color:#fff; font-size:12px; letter-spacing:0.06em; text-transform:uppercase;
    background: rgba(255,255,255,0.1); padding:6px 12px; border-radius:999px; }
  .lb-x { position:absolute; top:18px; right:24px; color:#fff; font-size:24px;
    background:transparent; border:0; cursor:pointer; opacity:0.6; }
  .lb-x:hover { opacity:1; }

  /* Mobile */
  @media (max-width: 760px) {
    .hd { padding:12px 20px; flex-wrap:wrap; }
    .hd a { font-size:10px; }
    .hero { padding:32px 20px 28px; }
    .hero-inner { grid-template-columns: 1fr; gap: 24px; }
    .hero-img { aspect-ratio: 16/10; margin-bottom:-32px; }
    .hero-h1 { font-size: 34px; }
    .hero-overview { font-size:15px; }
    .meta-grid { grid-template-columns: repeat(2,1fr); }
    .body { padding: 40px 20px 60px; }
    .section { margin-bottom: 44px; }
    .section-h2 { font-size: 24px; }
    .layout-media-left, .layout-media-right { grid-template-columns: 1fr; gap: 18px; }
    .extra-grid { grid-template-columns: repeat(2,1fr); gap:12px; }
    .gallery-grid { grid-template-columns: repeat(2,1fr); }
    .related-grid { grid-template-columns: repeat(2,1fr); }
  }
  @media (max-width: 460px) {
    .extra-grid, .gallery-grid, .related-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div id="root"></div>

<!-- Lightbox -->
<div class="lb" id="lb" onclick="closeLB()">
  <button class="lb-x" onclick="event.stopPropagation();closeLB()">×</button>
  <img id="lb-img" src="" alt="">
  <div class="lb-cap" id="lb-cap"></div>
</div>

<script>
const P = { cream:'#F7EBDC', peach:'#F5E1C3', coral:'#C3CC9B', red:'#546B41',
            sage:'#C3CC9B', forest:'#546B41', ink:'#1F1A14', paper:'#FFFAF0' };

// ───── Visitor gate ─────
async function sha256Hex(s){
  const b=new TextEncoder().encode(s);const h=await crypto.subtle.digest('SHA-256',b);
  return Array.from(new Uint8Array(h)).map(x=>x.toString(16).padStart(2,'0')).join('');
}
(function maybeShowGate(){
  const cfg=window.SITE_CONFIG||{};
  const need = !!(cfg.visitorProtect && cfg.visitorHash);
  if (!need || sessionStorage.getItem('visitor_auth')==='1') return;
  document.body.innerHTML = `
    <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;
      padding:20px;background:linear-gradient(135deg,${P.cream} 0%,${P.peach} 60%,${P.coral} 100%);">
      <div style="width:100%;max-width:380px;background:${P.paper};border-radius:14px;padding:32px;
        box-shadow:0 20px 60px -20px rgba(0,0,0,0.25);">
        <h1 style="font-family:'Playfair Display',Georgia,serif;font-weight:400;font-size:32px;
          margin:0 0 8px;letter-spacing:-0.01em;">Welcome</h1>
        <p style="margin:0 0 24px;color:rgba(31,26,20,0.6);font-size:13px;">Enter password to view this portfolio.</p>
        <form id="vgate-form">
          <input id="vgate-pw" type="password" placeholder="Password" autofocus
            style="width:100%;padding:11px 14px;border-radius:8px;border:1px solid ${P.ink}1f;
              font-family:Inter,sans-serif;font-size:14px;outline:none;box-sizing:border-box;"/>
          <div id="vgate-err" style="color:${P.red};font-size:12px;margin-top:10px;min-height:16px;"></div>
          <button type="submit" style="width:100%;margin-top:14px;padding:12px;border:0;border-radius:999px;
            background:linear-gradient(135deg,${P.coral},${P.red});color:${P.paper};
            font-family:Inter,sans-serif;font-size:14px;font-weight:500;cursor:pointer;
            box-shadow:0 8px 20px -8px ${P.red}90;">Enter</button>
        </form>
      </div>
    </div>`;
  document.getElementById('vgate-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const pw = document.getElementById('vgate-pw').value;
    const h = await sha256Hex(pw);
    if (h === cfg.visitorHash) {
      sessionStorage.setItem('visitor_auth','1');
      location.reload();
    } else {
      document.getElementById('vgate-err').textContent = 'Wrong password.';
    }
  });
  // Stop the rest of the article script from running
  throw new Error('locked');
})();

// Defaults — kept in sync with admin.html / index.html
const DEFAULT_PROJECTS = [
  {id:"p9",title:"Development of a card game to support dialogue training",client:"Association of Rural Culture and Education (MSL)",role:"Educational & Service Designer",year:"2021",tags:["Service Design","Facilitation","Toolkit"],description:"A card-based toolkit that compressed Sitra's Time Out dialogue method into a 2–3 hour training session.",cover:{hue:140,label:"Dialogue toolkit",imageUrl:"https://raw.githubusercontent.com/leenamarkiet-stack/portfolio/main/p9-cards.png"},caseStudy:{overview:"At the Association of Rural Culture and Education we trained member organisations in dialogue skills using the Time Out method developed by The Finnish Innovation Fund Sitra. The method worked, but it took longer than organisations had, and the practice sessions were too comfortable to prepare anyone for a real room.",team:"",duration:"",heroImage:"https://raw.githubusercontent.com/leenamarkiet-stack/portfolio/main/p9-cards.png",sections:[{heading:"The challenge",body:"• In practice sessions, participants tended to share similar backgrounds, ideologies or life situations. The discussion scenarios did not reflect real-life situations, so facilitation was never rehearsed in a sufficiently challenging atmosphere.\n\n• The key contents of Time Out needed to fit into roughly 2–3 hours, the average time organisations had available.\n\n• The training needed to be more lightweight overall.",layout:"text-only",images:[]},{heading:"What was designed",body:"• Game modes for building good dialogue, including monitoring and analysing discussion dynamics.\n\n• Facilitator's guide cards for steering the discussion, holding the key content of Time Out dialogue in a concise form.\n\n• Conversation style cards: green cards for building good dialogue, red cards for creating friction and challenge, specifically to support facilitation practice.\n\n• Citizen cards, bringing more diversity into the discussion and letting participants understand and present the perspectives that arise from people's backgrounds or values.\n\n• Role cards to shift mindset, prompting a more comprehensive examination of the topic and disrupting the traditional discussion dynamics of established groups such as a board of directors.",layout:"text-only",images:[]}]}},
  {id:"p10",title:"Service concept development for B2C and B2B electricity products",client:"Fortum (Customer Solutions)",role:"Service Designer",year:"2023",tags:["Service Design","UX Research","Energy"],description:"Two service concepts for a Nordic energy provider, where research kept surfacing the same gap between what the business wanted to build and the simplicity customers asked for.",cover:{hue:200,label:"Electricity services",imageUrl:"https://raw.githubusercontent.com/leenamarkiet-stack/portfolio/main/p10-5-mockups.png"},caseStudy:{overview:"I worked in Fortum's Nordic UX and Concepts team on two connected service concepts: Price Freeze, an add-on for spot-price customers, and a bundled offering for digital add-on services. In both, my role was to keep customer needs in focus while the business pushed towards more customisation, more automation and more packaging.",team:"Me, a business developer and a UX/UI designer",duration:"",heroImage:"https://raw.githubusercontent.com/leenamarkiet-stack/portfolio/main/p10-5-mockups.png",sections:[{heading:"Price Freeze",body:"Price Freeze is an add-on aimed at spot-price customers who want to secure a fixed price for one or two months without committing to a 12 or 24 month fixed contract. Offers go out by SMS and email a minimum of 2–4 times a year, depending on the country.\n\nThe service generates significant revenue through monthly fees and, in principle, answers a real need for peace of mind and flexibility. In practice it caused a lot of disappointment, because the fixed prices offered were too high.\n\nThe objective was to improve the service further. My responsibility was to protect and improve the value customers actually experienced — which was a challenge among business developers, whose focus was on more customisation options, more features, enabling freezes directly in the app rather than by SMS or phone, and automating offer generation.",layout:"media-right",images:[{label:"First version of the price freeze offer UX, designed with a UX designer",url:"https://raw.githubusercontent.com/leenamarkiet-stack/portfolio/main/p10-1-price-freeze.png"}]},{heading:"What I did",body:"• Gathering and organising customer feedback and requirements from the customer service and CX teams.\n\n• Working with the business developer to design an electronic survey (Forsta) sent to current and former customers across the Nordic countries.\n\n• Designing alternative service offerings that could be tested through the survey, along with testing interest in additional features and functionality.\n\n• Working with a UX designer to plan the essential functionality and interface of a potential application (Figma).\n\n• Analysing survey results and open-ended responses, and producing an analysis of needed improvements — pricing, features and process elements — shared with the validation board and the Head of Digital Customer Operations.",layout:"media-right",images:[{label:"Survey results across B2C, B2B and former customers",url:"https://raw.githubusercontent.com/leenamarkiet-stack/portfolio/main/p10-2-survey.png"}]},{heading:"What the research showed",body:"The research revealed a strong contradiction between the direction business developers wanted to take the product — more customisation, more automation — and what customers clearly wanted, which was simplicity.\n\nMuch of the disappointment traced back to pricing. Freeze offers are bound to electricity futures, which may not reflect current prices, and customers did not understand why a company that also produces electricity would offer such a high price. Changing that pricing model is difficult.\n\nI was also thrown into the project without preparation, and neither my team lead nor the business developer had a shared understanding of the service designer's role or the project's scope. Establishing that took as much work as the research itself.",layout:"text-only",images:[]},{heading:"Bundled offers",body:"Fortum had built a helper tool offering tailored recommendations for additional services based on a customer's answers to a short quiz. Alongside it, business stakeholders pushed hard to introduce pre-packaged offers, hoping to increase wallet share and make selection easier. This gave the project a very strong business focus.\n\nThe difficulty is that not all electricity-related services apply to every customer. I was not the project lead, which limited how much I could shape how the project ran.\n\nCustomer interviews were pivotal. Before I joined, an A/B test had been run without the necessary customer research, and the online smoke test results were far from what the business had hoped for.",layout:"media-right",images:[{label:"Quiz result: the three recommended contracts",url:"https://raw.githubusercontent.com/leenamarkiet-stack/portfolio/main/p10-3-quiz.png"}]},{heading:"My responsibilities",body:"• Customer recruitment.\n\n• Interview questions, interviews, transcripts and usability testing.\n\n• Analysing the interview material.\n\n• Summarising and drawing conclusions, and presenting development suggestions to the UX/UI designer, with whom I brainstormed alternative solutions.\n\n• Exploring ways to build and present the offers, and giving feedback to the UX designer.\n\nWe worked iteratively: if a few interviews or user tests indicated an issue, we produced a new version of the mock-up attempting an improvement or an alternative approach.",layout:"media-right",images:[{label:"Part of the table used to analyse every interview separately",url:"https://raw.githubusercontent.com/leenamarkiet-stack/portfolio/main/p10-4-analysis.png"}]},{heading:"Testing the models",body:"Recurring challenges:\n\n• How to offer the right amount of information on a limited screen, and make customers interested in and able to understand new digital add-on services.\n\n• How to build just three bundled packages that would serve every customer type.\n\n• Willingness to pay. Business stakeholders believed strongly in the “Netflix model” of three bundles, but when the origin of electricity was packaged together with smart services, willingness to pay was lower than for the same services bought separately. Many customers considered several services unnecessary, especially if they did not heat with electricity or own a large detached house.\n\nWe began, on the business unit's decision, with that Netflix model: three fixed offers side by side. As a challenger we researched modularity — customers selecting the services relevant to them to build a personalised package, following the quiz tool, with a discount level depending on how many add-ons they chose. This let customers tailor their offer, but some found it not simple enough.",layout:"media-right",images:[{label:"Left: on the business unit's decision we started with the “Netflix” model — three fixed offers side by side. This was our starting point for the first interview and UX testing rounds. Centre: first draft of the modular “build your own package” alternative; design by Leena. Right: the last mock-up version (Figma demo) after several rounds of UX testing and interviews, before I left Fortum.",url:"https://raw.githubusercontent.com/leenamarkiet-stack/portfolio/main/p10-5-mockups.png"}]},{heading:"What we learned",body:"We ended up leaning towards a partly modular approach: the customer chooses a spot or fixed contract, then whether they want renewable energy. Those two questions did the most segmenting work — spot suited risk-takers and EV owners, and the energy source choice was strongly tied to the customer's values. It also kept the number of packages shown from growing unmanageable.\n\nSelling renewable energy to as many customers as possible mattered commercially, and we learned that bundling it with smart features backfired: customers who valued renewable energy would not select it, because they felt they were paying for services they would never use. Keeping origin separate made pricing more transparent and gave it the emphasis it needed.\n\nThe interviews also showed that only EV owners and electric heating customers were interested in the app-based services at all. Others found them nice or interesting, but there was no willingness to pay unless consumption was very high.\n\nBefore more extensive testing, we were leaning towards two packages: Basic, aimed at apartment owners, and Smart, for villa owners and EV users.",layout:"text-only",images:[]}]}},
];

function loadData() {
  try { const s = localStorage.getItem('portfolio_data'); if (s) return JSON.parse(s); }
  catch(e) {}
  return null;
}

function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function placeholder(label, hue) {
  const c1 = `hsl(${hue}, 65%, 70%)`;
  const c2 = `hsl(${(hue+30)%360}, 60%, 55%)`;
  return `<div class="ph" style="background:linear-gradient(135deg,${c1},${c2});">
    <span>${escapeHtml(label || 'image')}</span>
  </div>`;
}

function imgOrPh(url, label, hue) {
  if (url) return `<img src="${escapeHtml(url)}" alt="${escapeHtml(label||'')}" data-src="${escapeHtml(url)}" data-cap="${escapeHtml(label||'')}">`;
  return placeholder(label || 'image', hue);
}

const params = new URLSearchParams(location.search);
const id = params.get('id') || 'p1';

const data = loadData();
const projects = (data && data.projects) || DEFAULT_PROJECTS;
const project = projects.find(p => p.id === id) || projects[0];
const cs = project.caseStudy || (DEFAULT_PROJECTS[0].caseStudy);
const bioEmail = (data && data.bio && data.bio.email) || 'leena@markiet.studo';

document.title = `${project.title} — Leena Markiet`;
const hue = (project.cover && project.cover.hue) || 18;

// Pale washes sampled from the page's flowers, used as the plate behind case
// study art. They show through transparent PNGs and fill any gap a contained
// image leaves, so a screenshot never sits on a bare white rectangle.
const PLATES = [
  'linear-gradient(135deg,#FDF8EA,#F8F1DE)',  // poppy
  'linear-gradient(135deg,#F3F6FC,#E9EFFA)',  // forget-me-not
  'linear-gradient(135deg,#FCF4F7,#F7EAEF)',  // pink
  'linear-gradient(135deg,#F6F8EF,#EDF1E2)',  // stem sage
  'linear-gradient(135deg,#FAF6F0,#F4ECE1)',  // anemone
  'linear-gradient(135deg,#F7F5FD,#EFEBF9)',  // lilac
];

function renderBody(text) {
  const blocks = String(text).split(/\n\s*\n/).filter(b => b.trim());
  let html = '';
  let bullets = [];
  const flush = () => {
    if (!bullets.length) return;
    html += `<ul class="section-list">${bullets
      .map(b => `<li>${escapeHtml(b)}</li>`).join('')}</ul>`;
    bullets = [];
  };
  blocks.forEach(b => {
    const t = b.trim();
    if (t.startsWith('\u2022')) {
      bullets.push(t.replace(/^\u2022\s*/, ''));
    } else {
      flush();
      html += `<p class="section-body">${escapeHtml(t)}</p>`;
    }
  });
  flush();
  return html;
}

function renderSection(sec, i) {
  const layout = sec.layout || 'media-left';
  const imgs = sec.images || [];
  const main = imgs[0];
  const extras = imgs.slice(1);

  const headHTML = `
    <div class="section-head">
      <span class="section-num">0${i+1}</span>
      <h2 class="section-h2">${escapeHtml(sec.heading)}</h2>
    </div>`;

  // Bodies mix prose and bullet lines. Rendering bullets as a real list gives
  // control over the spacing between items — as one pre-wrapped paragraph, the
  // blank line separating bullets was the only spacing available, and too wide.
  const bodyHTML = sec.body ? renderBody(sec.body) : '';

  if (layout === 'text-only') {
    return `<section class="section">${headHTML}${bodyHTML}</section>`;
  }

  if (layout === 'gallery') {
    const items = imgs.map((im, j) => `
      <div>
        <div class="extra-thumb" style="--plate:${PLATES[(i + j + 1) % PLATES.length]}">${imgOrPh(im.url, im.label, hue + j*22)}</div>
        ${im.label ? `<div class="extra-cap" style="margin-top:6px;">${escapeHtml(im.label)}</div>` : ''}
      </div>`).join('');
    return `<section class="section">${headHTML}${bodyHTML}
      <div class="gallery-grid">${items}</div></section>`;
  }

  // media-left or media-right
  const mainHTML = main ? `
    <div>
      <div class="main-image-wrap" style="--plate:${PLATES[i % PLATES.length]}">${imgOrPh(main.url, main.label, hue)}</div>
      ${main.label ? `<div class="main-image-cap">${escapeHtml(main.label)}</div>` : ''}
    </div>` : '';

  const textHTML = `<div>${bodyHTML}</div>`;

  const mediaRow = layout === 'media-right'
    ? `<div class="layout-media layout-media-right">${textHTML}${mainHTML}</div>`
    : `<div class="layout-media layout-media-left">${mainHTML}${textHTML}</div>`;

  const extrasHTML = extras.length ? `
    <div class="extra-grid">
      ${extras.map((im, j) => `
        <div class="extra-item">
          <div class="extra-thumb" style="--plate:${PLATES[(i + j + 1) % PLATES.length]}">${imgOrPh(im.url, im.label, hue + (j+1)*30)}</div>
          ${im.label ? `<div class="extra-cap">${escapeHtml(im.label)}</div>` : ''}
        </div>`).join('')}
    </div>` : '';

  return `<section class="section">${headHTML}${main ? mediaRow : bodyHTML}${extrasHTML}</section>`;
}

const sectionsHTML = (cs.sections || []).map(renderSection).join('');

// Related projects: pick the next ~3 projects after the current one (wrap around)
const TAG_PALETTES = [
  { bg:'rgba(195,204,155,0.45)', fg:'#546B41' },
  { bg:'rgba(245,225,195,0.70)', fg:'#7A5C2F' },
  { bg:'#E9E6F8',                fg:'#544A85' },
  { bg:'rgba(247,235,220,0.85)', fg:'#7A5C2F' },
  { bg:'#D9E4C7',                fg:'#546B41' },
  { bg:'#F7E3E9',                fg:'#8A5A66' },
  { bg:'#E3EAF8',                fg:'#43587A' },
  { bg:'#EFE6D6',                fg:'#5C3A0F' },
];
function relatedTagColor(tag) {
  let h = 0; for (let i = 0; i < tag.length; i++) h = (h*31 + tag.charCodeAt(i)) >>> 0;
  return TAG_PALETTES[h % TAG_PALETTES.length];
}
function pickRelated(all, currentId, n) {
  const idx = all.findIndex(p => p.id === currentId);
  if (idx < 0) return all.slice(0, n);
  const rest = [...all.slice(idx + 1), ...all.slice(0, idx)];
  return rest.slice(0, Math.min(n, rest.length));
}
const relatedProjects = pickRelated(projects, project.id, 3);
// Must stay identical to index.html's COVERS, and be indexed by the project's
// position in the project list rather than its position in this related grid,
// so a project keeps the same cover colour on both pages.
const COVERS = [
  'linear-gradient(135deg,#F9E3BD,#F3D18D)',  // poppy
  'linear-gradient(135deg,#C1D0EE,#9CB6E4)',  // forget-me-not
  'linear-gradient(135deg,#F7E3E9,#EFCBD9)',  // pink
  'linear-gradient(135deg,#CBD5AE,#A8B78A)',  // stem sage
  'linear-gradient(135deg,#F7EEDE,#EDDCC2)',  // blush
  'linear-gradient(135deg,#E9E6F8,#C9C1EA)',  // lilac
  'linear-gradient(135deg,#EDE2D7,#E0C4A8)',  // anemone
  'linear-gradient(135deg,#B9C69A,#7C8C6E)',  // deep sage
];

function relatedCardHTML(p) {
  const i = projects.findIndex(x => x.id === p.id);
  const cover = (p.cover && p.cover.imageUrl)
    ? `<img src="${escapeHtml(p.cover.imageUrl)}" alt="${escapeHtml(p.cover.label||p.title)}">`
    : `<div style="position:absolute;inset:0;background:${COVERS[(i < 0 ? 0 : i) % COVERS.length]};"></div>
       <div class="ph-gr"><span>${escapeHtml((p.cover && p.cover.label) || p.title)}</span></div>`;
  return `
    <a class="related-card" href="article.html?id=${encodeURIComponent(p.id)}">
      <div class="related-cover">
        ${cover}
        <span class="ph-yr">${escapeHtml(p.year || '')}</span>
      </div>
      <div class="related-body">
        <h3 class="related-title">${escapeHtml(p.title)}</h3>
        <div class="related-tags">
          ${(p.tags || []).slice(0, 3).map(t => {
            const c = relatedTagColor(t);
            return `<span class="related-tag" style="background:${c.bg};color:${c.fg};">${escapeHtml(t)}</span>`;
          }).join('')}
        </div>
      </div>
    </a>`;
}

const relatedHTML = relatedProjects.length ? `
  <section class="related">
    <div class="related-head">
      <h2 class="related-h2">More work</h2>
      <a class="related-link" href="index.html">All projects →</a>
    </div>
    <div class="related-grid">
      ${relatedProjects.map(p => relatedCardHTML(p)).join('')}
    </div>
  </section>` : '';

const heroImageHTML = cs.heroImage ? `

document.getElementById('root').innerHTML = `
<div class="hd">

</div>

<header class="hero">

  <div class="hero-inner${cs.heroImage ? '' : ' no-art'}">

  </div>
</header>

<div class="container">

    <div class="outro">

`;

// Lightbox wiring — any <img data-src="..."> becomes clickable
const lb = document.getElementById('lb');
const lbImg = document.getElementById('lb-img');
const lbCap = document.getElementById('lb-cap');
function openLB(src, cap) {
  lbImg.src = src;
  lbCap.textContent = cap || '';
  lbCap.style.display = cap ? 'block' : 'none';
  lb.classList.add('show');
  document.body.style.overflow = 'hidden';
}
function closeLB() {
  lb.classList.remove('show');
  document.body.style.overflow = '';
  setTimeout(() => { lbImg.src = ''; }, 200);
}
window.closeLB = closeLB;
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLB(); });
document.querySelectorAll('img[data-src]').forEach(img => {
  img.style.cursor = 'zoom-in';
  img.addEventListener('click', (e) => {
    e.stopPropagation();
    openLB(img.dataset.src, img.dataset.cap);
  });
});
// Also clicking on any wrapper that has an image should open it
document.querySelectorAll('.main-image-wrap, .extra-thumb, .hero-img').forEach(w => {
  w.addEventListener('click', (e) => {
    const img = w.querySelector('img[data-src]');
    if (img) { e.stopPropagation(); openLB(img.dataset.src, img.dataset.cap); }
  });
});
</script>
