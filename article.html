<!DOCTYPE html>
<html lang="en">
<head>

<title>Case Study — Leena Markiet</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap">
<script src="config.js"></script>
<style>
  /* A touch lighter than the front page: case studies are long reads, and the
     text sits on this ground for much longer. */
  :root { --cream:#FDFAF5; --yellowBloom:#FEFBEF; --tanBloom:#FCF5EC;
    --lilac:#E9E6F8; --stem:#7C8C6E; --stemDeep:#546B41; --stemDark:#33452A;
    --sage:#C3CC9B; --forest:#546B41; --ink:#1F1A14; --paper:#FFFAF0; }
  *,*::before,*::after { box-sizing: border-box; }
  html, body { margin:0; padding:0; background: var(--cream); color: var(--ink);
    font-family: Inter, system-ui, sans-serif; }
  img { display: block; max-width: 100%; height: auto; }

  @keyframes blob1 { 0%,100%{transform:translate(0,0) scale(1);} 33%{transform:translate(-60px,30px) scale(1.1);} 66%{transform:translate(40px,-20px) scale(0.95);} }
  @keyframes blob2 { 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(60px,40px) scale(1.1);} }
  .blob-a { animation: blob1 22s ease-in-out infinite; }
  .blob-b { animation: blob2 26s ease-in-out infinite; }

  /* Header */
  .hd { padding:14px 48px; position:sticky; top:0; z-index:100;
    background:rgba(253,250,245,0.92); backdrop-filter:blur(8px);
    border-bottom:1px solid rgba(0,0,0,0.08);
    display:flex; justify-content:space-between; align-items:center; gap:12px; }
  .hd a { color: var(--forest); text-decoration:none; font-size:11px;
    letter-spacing:0.1em; text-transform:uppercase; }
  .hd a:hover { color: var(--ink); }

  .container { max-width: 1240px; margin: 0 auto; }

  /* Hero */
  .hero { padding:48px 64px 36px;
    background: linear-gradient(135deg, var(--cream) 0%, var(--yellowBloom) 55%, var(--tanBloom) 100%);
    position:relative; }
  /* Blobs keep their own clipping layer so the hero can stay overflow-visible
     and let the art hang past the band into the section below. */
  .hero-blobs { position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:0; }
  .hero-content { position:relative; max-width:760px; }
  /* Two columns when the case study has a hero image: text left, art right.
     Falls back to a single column when there is no image. */
  .hero-inner { position:relative; z-index:1; display:grid; gap:44px; align-items:center;
    grid-template-columns: minmax(0,1.1fr) minmax(0,0.9fr); }
  .hero-inner.no-art { grid-template-columns: 1fr; }
  .hero-inner .hero-content { max-width:none; }
  .hero-tags { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:18px; }
  .hero-tag { font-size:11px; padding:5px 12px; border-radius:999px;
    background:linear-gradient(135deg,#F1EAFE 0%,#F9F8FF 100%);
    border:1px solid #F9F8FF; box-shadow:0 4px 10px -4px #F9F8FF66;
    color: var(--ink); font-weight:500; letter-spacing:0.04em; }
  .hero-h1 { font-family:'Playfair Display',Georgia,serif; font-weight:400;
    font-size:52px; line-height:1.05; letter-spacing:-0.02em; margin:0; color: var(--ink); }
  .hero-overview { margin:18px 0 0; font-size:16px; line-height:1.55; color: var(--ink); max-width:640px; }
  .meta-grid { margin-top:28px; display:grid;
    grid-template-columns:repeat(auto-fit,minmax(104px,1fr)); gap:14px;
    padding-top:18px; border-top:1px dashed rgba(31,26,20,0.25); }
  .meta-k { font-size:10px; letter-spacing:0.1em; color: var(--forest);
    text-transform:uppercase; margin-bottom:2px; }
  .meta-v { font-size:13px; color: var(--ink); }

  /* Hero image (optional) — sits in the hero's right column.
     contain, not cover: hero art is often a transparent PNG that should be
     shown whole, with the page fill visible behind it rather than cropped. */
  .hero-img { aspect-ratio: 4/3; max-height: 460px; width:100%;
    cursor:zoom-in; position:relative; z-index:2;
    margin-bottom:-74px; }
  .hero-img img { width:100%; height:100%; object-fit:contain;
    filter: drop-shadow(0 14px 28px rgba(31,26,20,0.16)); }

  /* Body */
  .body { padding: 56px 64px 80px; }

  /* Section */
  .section { margin-bottom: 44px; }
  .section-head { display:flex; align-items:baseline; gap:14px; margin-bottom: 14px; }
  .section-num { font-size:11px; letter-spacing:0.1em; font-weight:600;
    background: linear-gradient(135deg, var(--stem), var(--stemDeep), var(--stemDark));
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .section-h2 { font-family:'Playfair Display',Georgia,serif; font-weight:400;
    font-size:28px; letter-spacing:-0.01em; margin:0; color: var(--ink); }
  .section-body { font-size:15px; line-height:1.65; color:#3A332C;
    margin: 0 0 18px; white-space: pre-wrap; }
  .section-list { font-size:15px; line-height:1.55; color:#3A332C;
    margin: 0 0 18px; padding-left: 20px; }
  .section-list li { margin: 0 0 7px; padding-left: 2px; }
  .section-list li::marker { color: var(--stem); }
  .section-list li:last-child { margin-bottom: 0; }

  /* Layouts */
  .layout-media { display:grid; gap:28px; align-items:start; }
  .layout-media-left  { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .layout-media-right { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  /* No fixed aspect: case study art ranges from tall phone mock-ups to wide
     tables, and a fixed frame letterboxes one or the other. */
  .main-image-wrap { position:relative; max-height: 440px;
    border-radius:10px; overflow:hidden; border:none;
    background:transparent; cursor:zoom-in; transition: transform .2s ease; }
  .main-image-wrap:hover { transform: translateY(-2px); box-shadow: 0 14px 30px -16px rgba(0,0,0,0.3); }
  .main-image-wrap img { display:block; width:100%; height:auto;
    max-height:440px; object-fit:contain; object-position:left center;
    padding:0 14px; box-sizing:border-box; }
  .main-image-cap { font-size:13.5px; color:#3A332C; margin-top:9px; padding-left:14px;
    letter-spacing:0.01em; line-height:1.45; }

  /* Smaller image grid */
  .extra-grid { display:grid; grid-template-columns: repeat(3, 1fr); gap:16px; margin-top: 24px; }
  .extra-item { display:flex; flex-direction:column; gap:6px; }
  .extra-thumb { aspect-ratio: 4/3; max-height: 240px; border-radius:6px; overflow:hidden;
    border:none; background:transparent;
    cursor:zoom-in; transition: transform .2s ease; }
  .extra-thumb:hover { transform: translateY(-2px); box-shadow: 0 10px 22px -14px rgba(0,0,0,0.3); }
  .extra-thumb img { width:100%; height:100%; object-fit:contain;
    object-position:left center; padding:0 8px; box-sizing:border-box; }
  .extra-cap { font-size:12.5px; color:#3A332C; padding-left:8px; letter-spacing:0.01em; line-height:1.4; }

  .gallery-grid { display:grid; grid-template-columns: repeat(3,1fr); gap:28px; margin-top:22px; }
  .gallery-shot { border-radius:10px; overflow:hidden; background:transparent; cursor:zoom-in;
    transition: transform .2s ease; }
  .gallery-shot:hover { transform: translateY(-2px); box-shadow: 0 14px 30px -16px rgba(0,0,0,0.3); }
  .gallery-shot img { display:block; width:100%; height:auto; max-height:440px;
    object-fit:contain; object-position:left center; }

  /* Outro */
  .outro { padding-top:24px; border-top:1px solid rgba(0,0,0,0.12);
    display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap; }
  .outro-end { font-size:11px; letter-spacing:0.08em; color:#5C544A; text-transform:uppercase; }
  .cta { font-size:13px; font-weight:500; padding:10px 18px; border-radius:999px;
    background: linear-gradient(135deg, var(--stem), var(--stemDeep)); color: var(--paper);
    text-decoration:none; box-shadow:0 8px 20px -8px rgba(84,107,65,0.45); }

  /* Related projects */
  .related { padding: 56px 0 0; }
  .related-head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:18px; gap:14px; }
  .related-h2 { font-family:'Playfair Display',Georgia,serif; font-weight:400; font-size:28px;
    letter-spacing:-0.01em; margin:0; color: var(--ink); }
  .related-link { font-size:11px; letter-spacing:0.08em; color: var(--forest);
    text-transform:uppercase; text-decoration:none; }
  .related-link:hover { color: var(--ink); }
  .related-grid { display:grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .related-card { background: var(--paper); border:1px solid rgba(31,26,20,0.07);
    border-radius:8px; overflow:hidden; cursor:pointer; text-decoration:none; color: inherit;
    display:flex; flex-direction:column;
    transition: transform .18s ease, box-shadow .18s ease; }
  .related-card:hover { transform: translateY(-3px);
    box-shadow: 0 18px 36px -16px rgba(31,26,20,0.25); }
  .related-cover { aspect-ratio: 4/3; position: relative; overflow:hidden; }
  .related-cover img { width:100%; height:100%; object-fit: cover; }
  .related-cover .ph-gr { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  .related-cover .ph-gr span { font-size:10.5px; letter-spacing:0.08em; color: var(--ink);
    text-transform:uppercase; padding:5px 11px; border-radius:999px; background:rgba(255,250,240,0.85); }
  .related-cover .ph-yr {
    position:absolute; top:8px; right:8px;
    font-size:10px; font-weight:500; padding:3px 8px; border-radius:999px;
    color: var(--paper); background: linear-gradient(135deg, var(--stem), var(--stemDeep));
  }
  .related-body { padding: 12px 14px 14px; display:flex; flex-direction:column; gap:6px; flex:1; }
  .related-title { font-family:'Playfair Display',Georgia,serif; font-weight:400;
    font-size:18px; line-height:1.2; margin:0; color: var(--ink); }
  .related-tags { display:flex; flex-wrap:wrap; gap:4px; margin-top:auto; padding-top:6px; }
  .related-tag { font-size:10.5px; padding:2px 8px; border-radius:4px;
    background: rgba(195,204,155,0.45); color: var(--forest); font-weight:500; }

  /* Placeholder */
  .ph { width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
  .ph span { font-size:10px; letter-spacing:0.08em; text-transform:uppercase;
    color:rgba(255,255,255,0.92); padding:5px 10px; border-radius:999px;
    background: rgba(0,0,0,0.18); }

  /* Lightbox */
  .lb { position:fixed; inset:0; background: #1F1A14; z-index:9999;
    display:none; align-items:center; justify-content:center; padding:24px; cursor:zoom-out; }
  .lb.show { display:flex; }
  /* The plate wraps the image and shrinks to it, so there is no cream slab
     around a portrait screenshot. */
  .lb-plate { background:#FFFFFF; border-radius:12px; padding:12px;
    max-width:94vw; max-height:88vh; display:flex; }
  .lb img { display:block; width:auto; height:auto;
    max-width:calc(94vw - 24px); max-height:calc(88vh - 24px); border-radius:4px; }
  .lb-cap { position:absolute; bottom:18px; left:50%; transform:translateX(-50%);
    color:#fff; font-size:14px; letter-spacing:0.01em; line-height:1.45;
    max-width:min(90vw,900px); text-align:center;
    background: rgba(0,0,0,0.45); padding:9px 16px; border-radius:12px; }
  .lb-x { position:absolute; top:18px; right:24px; color:#fff; font-size:24px;
    background:transparent; border:0; cursor:pointer; opacity:0.6; }
  .lb-x:hover { opacity:1; }

  /* Mobile */
  @media (max-width: 760px) {
    .hd { padding:12px 20px; flex-wrap:wrap; }
    .hd a { font-size:10px; }
    .hero { padding:32px 20px 28px; }
    .hero-inner { grid-template-columns: 1fr; gap: 24px; }
    .hero-img { aspect-ratio: 16/10; margin-bottom:-32px; }
    .hero-h1 { font-size: 34px; }
    .hero-overview { font-size:15px; }
    .meta-grid { grid-template-columns: repeat(2,1fr); }
    .body { padding: 40px 20px 60px; }
    .section { margin-bottom: 44px; }
    .section-h2 { font-size: 24px; }
    .layout-media-left, .layout-media-right { grid-template-columns: 1fr; gap: 18px; }
    .extra-grid { grid-template-columns: repeat(2,1fr); gap:12px; }
    .gallery-grid { grid-template-columns: repeat(2,1fr); }
    .related-grid { grid-template-columns: repeat(2,1fr); }
  }
  @media (max-width: 460px) {
    .extra-grid, .gallery-grid, .related-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div id="root"></div>

<!-- Lightbox -->
<div class="lb" id="lb" onclick="closeLB()">
  <button class="lb-x" onclick="event.stopPropagation();closeLB()">×</button>
  <div class="lb-plate"><img id="lb-img" src="" alt=""></div>
  <div class="lb-cap" id="lb-cap"></div>
</div>

<script>
const P = { cream:'#F7EBDC', peach:'#F5E1C3', coral:'#C3CC9B', red:'#546B41',
            sage:'#C3CC9B', forest:'#546B41', ink:'#1F1A14', paper:'#FFFAF0' };

// ───── Visitor gate ─────
async function sha256Hex(s){
  const b=new TextEncoder().encode(s);const h=await crypto.subtle.digest('SHA-256',b);
  return Array.from(new Uint8Array(h)).map(x=>x.toString(16).padStart(2,'0')).join('');
}
(function maybeShowGate(){
  const cfg=window.SITE_CONFIG||{};
  const need = !!(cfg.visitorProtect && cfg.visitorHash);
  if (!need || sessionStorage.getItem('visitor_auth')==='1') return;
  document.body.innerHTML = `
    <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;
      padding:20px;background:linear-gradient(135deg,${P.cream} 0%,${P.peach} 60%,${P.coral} 100%);">
      <div style="width:100%;max-width:380px;background:${P.paper};border-radius:14px;padding:32px;
        box-shadow:0 20px 60px -20px rgba(0,0,0,0.25);">
        <h1 style="font-family:'Playfair Display',Georgia,serif;font-weight:400;font-size:32px;
          margin:0 0 8px;letter-spacing:-0.01em;">Welcome</h1>
        <p style="margin:0 0 24px;color:rgba(31,26,20,0.6);font-size:13px;">Enter password to view this portfolio.</p>
        <form id="vgate-form">
          <input id="vgate-pw" type="password" placeholder="Password" autofocus
            style="width:100%;padding:11px 14px;border-radius:8px;border:1px solid ${P.ink}1f;
              font-family:Inter,sans-serif;font-size:14px;outline:none;box-sizing:border-box;"/>
          <div id="vgate-err" style="color:${P.red};font-size:12px;margin-top:10px;min-height:16px;"></div>
          <button type="submit" style="width:100%;margin-top:14px;padding:12px;border:0;border-radius:999px;
            background:linear-gradient(135deg,${P.coral},${P.red});color:${P.paper};
            font-family:Inter,sans-serif;font-size:14px;font-weight:500;cursor:pointer;
            box-shadow:0 8px 20px -8px ${P.red}90;">Enter</button>
        </form>
      </div>
    </div>`;
  document.getElementById('vgate-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const pw = document.getElementById('vgate-pw').value;
    const h = await sha256Hex(pw);
    if (h === cfg.visitorHash) {
      sessionStorage.setItem('visitor_auth','1');
      location.reload();
    } else {
      document.getElementById('vgate-err').textContent = 'Wrong password.';
    }
  });
  // Stop the rest of the article script from running
  throw new Error('locked');
})();

// Defaults — kept in sync with admin.html / index.html
const DEFAULT_PROJECTS = [
  {id:"p13",title:"COOLSTEPS: routing pedestrians by heat, not distance",client:"Self-initiated concept",role:"Service Design + UI/UX",year:"2026",tags:["Service Design","UI Design","Vibecoding"],description:"Heat-safe pedestrian mobility. In a Dubai summer the shortest walk is often the most dangerous one, so COOLSTEPS routes pedestrians by felt heat exposure rather than distance, adapting its advice to who is walking and when. Delivered as a working mobile prototype.",cover:{hue:30,label:"COOLSTEPS",imageUrl:"https://raw.githubusercontent.com/leenamarkiet-stack/portfolio/main/p13-1-hero.png"},caseStudy:{overview:"COOLSTEPS Dubai is a heat-resilience service concept with two sides. For residents it is a mobile app that recommends heat-safe walking routes, safe times of day and route-level heat exposure scores. For institutions — Dubai Municipality, the Dubai Development Authority, developers — it offers heat-risk insight across the walkable network.\n\nThe demo focuses on the citizen-facing app, piloted on a walkable network of around 40 route segments in Business Bay. Format: high-fidelity design, then a functioning coded prototype on real map data.",team:"",duration:"",heroImage:"https://raw.githubusercontent.com/leenamarkiet-stack/portfolio/main/p13-1-hero.png",sections:[{heading:"The problem",body:"Navigation apps optimise for time and distance. In Dubai's summer, where felt temperatures on open pavement can exceed 50°C, that logic can send people down the most exposed street in the city.\n\nHeat risk is not uniform either. The same street at the same hour carries a different risk for a healthy adult, a child, an older person, or someone doing heavy outdoor work.",layout:"media-right",images:[{label:"The walkable network scored by felt temperature, re-scored hour by hour",url:"https://raw.githubusercontent.com/leenamarkiet-stack/portfolio/main/p13-5-startpoint.png"}]},{heading:"Who it serves",body:"• Everyday pedestrians choosing between getting there fast and getting there safely.\n\n• Vulnerable groups — older people and children — who reach dangerous heat sooner.\n\n• Outdoor workers, whose exposure is governed by law as well as by comfort.\n\n• City institutions that need to see where the walking network fails people.",layout:"text-only",images:[]},{heading:"Key design drivers",body:"• Make heat the primary variable, not distance. Every route is scored on felt temperature, combining air temperature, shade, surface heat and radiant load — not the forecast number. The network is colour-coded by heat, so the city's thermal landscape is visible before you plan anything.\n\n• Present a choice, not a single answer. The coolest route is often a detour, and whether that is worth it depends on the trip: a rushed commute and an evening walk call for different answers. Three options sit side by side — shortest, most shaded, lowest heat exposure — each with distance, walking and cycling time, shade coverage and heat exposure. The trade-off is explicit and the user makes the call.\n\n• Personalise risk, not just preferences. Four walker profiles (adult, outdoor worker, elderly, child) each carry their own comfort thresholds. The same 36°C route reads as “Hot” for an adult and “Very Hot” for an older walker. Temperatures stay the same across profiles; only the interpretation changes, which keeps the data honest and the advice relevant.\n\n• Treat time as a design material. Heat depends as much on when you walk as on where. A time-of-day slider re-scores the whole network hour by hour, and a recommended activity window tells each profile when conditions become manageable. Walking time can be planned, not just walking routes.\n\n• Design for outdoor workers as a distinct service user. UAE law bans outdoor work in the midday hours during summer. For the outdoor-worker profile the app surfaces the ban only while it is actually in force — a permanent banner would become wallpaper. It also maps air-conditioned rest shelters with facilities and opening hours, and any shelter can be set as the start or end of a route. This is where the product touches the wider service: employer obligations, public infrastructure and daily routines.\n\n• Work within the limits of the data. Microclimate data exists only for certain areas of the network, so every route shows how much of the walk leaves it and falls onto unmeasured, usually unshaded pavement. When a trip is mostly off-network, the app offers only the shortest route rather than alternatives the data cannot justify. When two options are effectively the same walk, it shows one. Temperatures were calibrated to stay plausible for Dubai.\n\n• Build on familiar mental models. The interaction borrows from mainstream navigation apps: a single search box that expands into A and B fields, live address suggestions, tap-to-place pins and street-level turn-by-turn guidance. The new idea is heat, not the controls, so the learning curve sits there.",layout:"media-right",images:[{label:"A planned route at 2pm: extreme heat, and only the shortest option the data can justify",url:"https://raw.githubusercontent.com/leenamarkiet-stack/portfolio/main/p13-6-route.png"}]},{heading:"Selected design decisions",body:"• Map legibility under heat. The heat layer sits beneath roads and labels so the street network stays readable through it. Overlapping route options are drawn side by side instead of hiding each other, and the selected route takes a neutral outline so its heat colours carry the story.\n\n• Consistency between list and map. A and B share the same colours in the search field and on the map, and the location button uses the same symbol as the location marker — so you can see at a glance that the control and the map object are the same thing.\n\n• Readable outdoors. A strict four-step type scale (12, 14, 16 and 18px) with a 12px floor, for a product used on a phone in bright sun.",layout:"text-only",images:[]},{heading:"Outcome",body:"A working prototype covering the full citizen journey: explore the city's heat, pick a profile and time, plan and compare routes, find cooled rest points, and navigate turn by turn.\n\nIt runs on real OpenStreetMap data for Business Bay, though without real temperature data.",layout:"text-only",images:[]}]}},
  {id:"p12",title:"CCTV Coverage Study",client:"Space42",role:"UI/UX + Service Design",year:"2026",tags:["Vibecoding","Figma","UI Design","Digital Twins"],description:"The security planning tool in Space42's Digital Twin product family. Built code-first alongside a shared design system, testing each component in a real product before it served the wider family. The code also became the reference for an AI workflow that generates Figma frames from code.",cover:{hue:220,label:"CCTV Coverage Study",imageUrl:"https://raw.githubusercontent.com/leenamarkiet-stack/portfolio/main/p12-4-aim.png"},caseStudy:{overview:"One product in a family of Digital Twin applications. It was built code-first alongside a shared design system, and it became the reference for generating Figma designs with AI.",team:"Me",duration:"1.5 weeks",heroImage:"https://raw.githubusercontent.com/leenamarkiet-stack/portfolio/main/p12-4-aim.png",sections:[{heading:"Context",body:"Space42's Digital Twin platform brings several specialist tools together around one model of a building. CCTV Coverage Study is the security planning tool in that family.\n\nPlanners place cameras in the building's 3D model, see what each one covers, and find blind spots floor by floor before anything is installed on site.",layout:"text-only",images:[]},{heading:"My role",body:"UI/UX and service design, covering the specifications, interaction design, the design system and the Figma files.",layout:"text-only",images:[]},{heading:"Designing for a product family",body:"This product was built at the same time as the Space42 design system, and it was the design system's first real product. That made it the proving ground for the shared foundations: components, colour tokens, typography, light and dark themes, and Arabic with right-to-left layouts.\n\nEach gap CCTV exposed was fixed in the design system rather than patched locally, so the fix reached every product in the family. Once the foundations were stable, the design system moved into its own repository with its own ownership, serving CCTV and its sibling products the same way.\n\nThe influence ran both ways. The look and feel of this product became the basis for the design system's own \u2014 its spacing scale and layout patterns started here, settled in a product that had to work rather than decided in the abstract.",layout:"text-only",images:[]},{heading:"Code-first, with Figma generated from the build",body:"The product was designed and built in code first. It then became the reference for an AI workflow that generates Figma frames from code, which tested the design system from both directions.\n\nComponents had to hold up in a working product, and they had to come out as faithful, token-based Figma components. Keeping code, Figma and the design system in step became part of the process, not a clean-up afterwards.",layout:"gallery",images:[{label:"Figma frames generated from the built product using the design system — dark theme",url:"https://raw.githubusercontent.com/leenamarkiet-stack/portfolio/main/p12-1-figma-dark.png"},{label:"The same generation in light theme, with the camera list and placement armed",url:"https://raw.githubusercontent.com/leenamarkiet-stack/portfolio/main/p12-2-figma-light.png"}]},{heading:"Key design decisions",body:"• Aiming a camera: eight directions that nudge in small steps instead of jumping 45°, with pan and tilt on one control placed next to the view it changes.\n\n• Studies are named when they're created: there is no “Untitled study” default, which prevents a list of studies that all look the same.\n\n• Feedback that says what happened: undo names the property that changed, and the aim reference changes wording for wall and ceiling mounts.\n\n• Colour with meaning: shades of blue show single versus overlapping coverage, contrast-safe values meet WCAG AA, and green and red show whether a camera can be placed.\n\n• Designed for bilingual use from the start: Arabic and English, with mixed-direction text handled properly.",layout:"media-right",images:[{label:"Top view with a camera selected: the pan and tilt control sits next to the view it changes",url:"https://raw.githubusercontent.com/leenamarkiet-stack/portfolio/main/p12-4-aim.png"}]},{heading:"What it showed",body:"Building in code first brought out the real states early — empty, locked, connection lost and recovery. Using the design system in a live product exposed issues that reviewing it in isolation had missed.\n\nOwning the design system separately is what lets a product family grow without each product drifting into its own version.",layout:"text-only",images:[]}]}},
  {id:"p11",title:"Data Hub: from zero to a scalable design foundation",client:"Space42",role:"UI/UX + Service Design",year:"2025",tags:["UI Design","Enterprise"],description:"Lead designer on a newly ideated enterprise data platform, joining with no design system, no user flows and no UX direction in place. One governed pipeline replacing fragmented, engineer-only tooling with something data and operations staff could run themselves.",cover:{hue:210,label:"Data Hub",imageUrl:"https://raw.githubusercontent.com/leenamarkiet-stack/portfolio/main/p11-1-landing.png"},caseStudy:{overview:"Data Hub is an internal admin platform that lets Space42 teams connect, ingest, transform and expose organisational data from a single interface. Version 1 consolidates file uploads, database pulls, REST APIs, WebSocket and MQTT streams into one governed pipeline, replacing fragmented, engineer-only tooling with a self-serve product usable by data and operations staff.",team:"Me as UI/UX designer, a lead data engineer and a front-end developer",duration:"",heroImage:"https://raw.githubusercontent.com/leenamarkiet-stack/portfolio/main/p11-1-landing.png",sections:[{heading:"My role",body:"I joined a small, fast-moving team as the senior and lead UX/UI designer on a newly ideated platform, with some additional help for Figma prototyping. Engineering had already begun backend integration; the user-facing experience did not yet exist.\n\nI was responsible for shaping the whole of it — service mapping, interaction design, UI foundations and developer handoff. Much of that work happened alongside the data engineers rather than ahead of them, aligning UI states with real pipeline behaviour (sync status, ingestion strategies, schema constraints) so the interface described what the system actually does.",layout:"media-right",images:[{label:"Data Sources — every connected source with its sync status",url:"https://raw.githubusercontent.com/leenamarkiet-stack/portfolio/main/p11-2-sources.png"}]},{heading:"The challenge",body:"Data onboarding ran on multiple tools, manual scripts and tribal knowledge. Users had no visibility into source health, sync history, or what had changed after ingestion.\n\nThe design problem was not simplification. Schema selection, upsert and append strategies and JSON flattening had to become legible and safe for non-engineers without being watered down for the technical users who depended on them.",layout:"text-only",images:[]},{heading:"Starting from zero",body:"There was no design foundation to build on: no UI components, no user flows, no style guide. The company was mid-way through a brand renewal at the same time.\n\n• Complex user roles, from business users to highly technical data teams.\n\n• A data-heavy environment, where clarity had to be balanced against power and flexibility.\n\n• An agile, startup-style setting where decisions had to be fast, lean and iterative.\n\n• Limited visibility of the roadmap — only the initial key modules were defined and the broader scope was still moving.\n\nSo I built a lightweight interim UI kit — tokens, core components, status and messaging patterns — designed to be re-skinned once the new brand landed rather than blocking delivery on it. V1 flows were deliberately held to what engineering could ship and support reliably; several interactions, such as transformer tooling and query building, were designed to a functional baseline with the more advanced versions documented for later releases.",layout:"text-only",images:[]},{heading:"Designing without users",body:"The product had no active users yet, so there was no feedback, usage data or prior research to design from — and the pace left no room for formal research or testing.\n\nOur product owner worked closely with the first customer stakeholders, gathering early insights, requirements and priorities. That collaboration carried the initial design direction in the absence of research of my own.\n\nWorking that way put the weight on principles rather than evidence. I prioritised clarity, intuitive structure and simplicity, aiming for a foundation clean enough to scale and loose enough to adapt as the product found its shape.",layout:"text-only",images:[]},{heading:"What I designed",body:"• Service blueprint and IA — mapped the full data lifecycle (connect, configure, ingest, transform, expose, audit) into seven core modules: Dashboard, Data Sources, Data Syncs, Alerts, Endpoint Mapping, Services and Settings.\n\n• Multi-source onboarding — consistent creation wizards for File, Database, API (push and pull), WebSocket and MQTT sources, covering auth, mapping, upload progress and success and error states.\n\n• Schema configuration — table and column selection with primary key, nullability and per-table ingestion strategy (upsert or append), plus custom SQL and a preview before commit.\n\n• JSON Transformer — a visual field selector for nested JSON, static entries, split-row and split-column operations, and a preview and summary surfacing renamed fields, type changes and nulls before creation.\n\n• Operational dashboard — source health, system load, recent syncs and alert severity tiers, to move users from reactive to proactive monitoring.\n\n• Records and audit trail — searchable record tables, detail views, change history and empty-state handling.\n\n• Endpoint Mapping — form-driven publishing of PostgreSQL objects as API endpoints, with pagination and output-type controls.\n\n• Interim UI foundations — reusable components and a shared state language across all modules, structured for migration into the future brand system.",layout:"media-right",images:[{label:"Creating a data source: database pull configuration",url:"https://raw.githubusercontent.com/leenamarkiet-stack/portfolio/main/p11-3-create.png"},{label:"JSON Transformer — visual field selector for nested JSON",url:"https://raw.githubusercontent.com/leenamarkiet-stack/portfolio/main/p11-4-json.png"},{label:"Services — published services across the platform",url:"https://raw.githubusercontent.com/leenamarkiet-stack/portfolio/main/p11-5-services.png"}]},{heading:"Outcome and next steps",body:"The interim UI kit became the seed for the post-rebrand design system, and was used in the first versions of the Digital Twin solutions.\n\nData Hub v1 ran for about a year before a new version launched in 2026.",layout:"text-only",images:[]}]}},
  {id:"p10",title:"Service concept development for B2C and B2B electricity products",client:"Fortum (Customer Solutions)",role:"Service Designer",year:"2023",tags:["Service Design","UX Research","Energy"],description:"Two service concepts for a Nordic energy provider, where research kept surfacing the same gap between what the business wanted to build and the simplicity customers asked for.",cover:{hue:200,label:"Electricity services",imageUrl:"https://raw.githubusercontent.com/leenamarkiet-stack/portfolio/main/p10-5-mockups.png"},caseStudy:{overview:"In Fortum's Nordic UX and Concepts team I worked on two service concepts: Price Freeze, an add-on for spot-price customers, and a bundled offering for digital add-on services. Both ran into the same tension. The business wanted more — more options, more automation, more packaged together — while customers, in survey after interview, asked for less. My job was to keep that evidence in the room.",team:"Me, a business developer and a UX/UI designer",duration:"",heroImage:"https://raw.githubusercontent.com/leenamarkiet-stack/portfolio/main/p10-5-mockups.png",sections:[{heading:"Price Freeze",body:"Price Freeze lets spot-price customers lock a fixed price for one or two months without committing to a 12 or 24 month contract. Offers go out by SMS and email at least 2–4 times a year, depending on the country.\n\nOn paper it answers a real need for peace of mind and flexibility, and it earns well through monthly fees. In practice it generated a steady stream of disappointment, because the prices offered were too high to feel like a good deal.\n\nThe brief was to develop the service further. The business developers wanted more customisation, more features, freezing directly in the app instead of by SMS or phone, and automated offer generation. My responsibility was the part nobody else owned: whether any of it improved what customers actually experienced.",layout:"media-right",images:[{label:"First version of the price freeze offer UX, designed with a UX designer",url:"https://raw.githubusercontent.com/leenamarkiet-stack/portfolio/main/p10-1-price-freeze.png"}]},{heading:"What I did on Price Freeze",body:"• Gathered and organised customer feedback and requirements from the customer service and CX teams.\n\n• Designed an electronic survey with the business developer (Forsta), sent to current and former customers across the Nordic countries.\n\n• Built alternative service offerings into the survey so they could be tested directly, alongside interest in new features.\n\n• Planned the essential functionality and interface of a possible app with a UX designer (Figma).\n\n• Analysed the results, including open-ended responses, into a set of recommended improvements across pricing, features and process, presented to the validation board and the Head of Digital Customer Operations.",layout:"media-right",images:[{label:"Survey results across B2C, B2B and former customers",url:"https://raw.githubusercontent.com/leenamarkiet-stack/portfolio/main/p10-2-survey.png"}]},{heading:"What the research showed",body:"The findings pointed the opposite way to the roadmap. Where the business saw customisation and automation, customers wanted the offer to be simpler and the price to make sense.\n\nMost of the disappointment traced back to pricing rather than features. Freeze offers are bound to electricity futures, which need not resemble today's prices, and customers could not reconcile a high quote with the fact that Fortum produces electricity itself. That pricing model is not easily changed, which made it an uncomfortable finding to deliver.\n\nI joined the project without preparation, and neither my team lead nor the business developer had a shared view of what a service designer was there to do, or how far the project reached. Establishing that took as much effort as the research.",layout:"text-only",images:[]},{heading:"Bundled offers",body:"Fortum had built a helper tool that recommends additional services from a customer's answers to a short quiz. Around it, business stakeholders pushed for pre-packaged offers, expecting a larger share of wallet and an easier decision. The commercial pull on this project was strong.\n\nThe catch is that electricity services are not universally relevant: what suits an EV owner in a detached house is dead weight to someone in a flat. I was not the project lead, which limited how much I could change the way it ran.\n\nBefore I joined, an A/B test had gone ahead without customer research behind it, and the online smoke test underperformed what the business expected. Interviews became the correction.",layout:"media-right",images:[{label:"Quiz result: the three recommended contracts",url:"https://raw.githubusercontent.com/leenamarkiet-stack/portfolio/main/p10-3-quiz.png"}]},{heading:"My role in the bundling work",body:"• Recruited customers and ran the interviews, transcripts and usability tests.\n\n• Analysed the interview material, drew the conclusions, and took development suggestions to the UX/UI designer, where we worked through alternatives together.\n\n• Explored how the offers could be built and presented, feeding that back into the design.\n\nWe worked in short loops. When a few interviews pointed at the same problem, we rebuilt that part of the mock-up and tested the new version rather than arguing about it.",layout:"media-right",images:[{label:"Part of the table used to analyse every interview separately",url:"https://raw.githubusercontent.com/leenamarkiet-stack/portfolio/main/p10-4-analysis.png"}]},{heading:"Testing the models",body:"Three questions kept returning:\n\n• How much can a small screen explain before it stops being read — and how do you make an unfamiliar digital add-on sound worth understanding?\n\n• Can three packages genuinely serve every kind of customer?\n\n• What are people actually willing to pay for? Stakeholders believed in a “Netflix model” of three bundles, but bundling renewable origin together with smart services lowered willingness to pay below what the same services fetched separately. Customers who did not heat with electricity or own a large house read most of the bundle as padding.\n\nWe started, by the business unit's decision, with that Netflix model: three fixed offers side by side. As a challenger we tested modularity — customers picking the services relevant to them after the quiz, with the discount scaling to how many they chose. It gave people control, and several still found it more work than they wanted.",layout:"media-right",images:[{label:"Left: on the business unit's decision we started with the “Netflix” model — three fixed offers side by side. This was our starting point for the first interview and UX testing rounds. Centre: first draft of the modular “build your own package” alternative; design by Leena. Right: the last mock-up version (Figma demo) after several rounds of UX testing and interviews, before I left Fortum.",url:"https://raw.githubusercontent.com/leenamarkiet-stack/portfolio/main/p10-5-mockups.png"}]},{heading:"Where it landed",body:"We landed on something partly modular. The customer picks a contract type, spot or fixed, then whether they want renewable energy. Those two questions carry most of the segmentation: spot suits risk-takers and EV owners, and energy origin tracks closely to what someone values. They also keep the number of visible packages from multiplying past the point of choice.\n\nSeparating renewable origin from the bundle mattered commercially. Bundled with smart features, customers who genuinely valued renewable energy declined it, because accepting meant paying for services they would never open. Kept separate, the pricing was legible and the origin got the emphasis it deserved.\n\nThe interviews also drew a sharp line around the app services: only EV owners and electric-heating customers wanted them. Everyone else found them interesting and would not pay, unless their consumption was unusually high.\n\nBefore wider testing, we were converging on two packages rather than three — Basic for apartments, Smart for houses and EV owners.",layout:"text-only",images:[]}]}},
  {id:"p9",title:"Development of a card game to support dialogue training",client:"Association of Rural Culture and Education (MSL)",role:"Educational & Service Designer",year:"2021",tags:["Service Design","Facilitation","Toolkit"],description:"A card-based toolkit that compressed Sitra's Time Out dialogue method into a 2–3 hour training session.",cover:{hue:140,label:"Dialogue toolkit",imageUrl:"https://raw.githubusercontent.com/leenamarkiet-stack/portfolio/main/p9-cards.png"},caseStudy:{overview:"At the Association of Rural Culture and Education we trained member organisations in dialogue skills using the Time Out method developed by The Finnish Innovation Fund Sitra. The method worked, but it took longer than organisations had, and the practice sessions were too comfortable to prepare anyone for a real room.",team:"Me and a colleague",duration:"",heroImage:"https://raw.githubusercontent.com/leenamarkiet-stack/portfolio/main/p9-cards.png",sections:[{heading:"The challenge",body:"• In practice sessions, participants tended to share similar backgrounds, ideologies or life situations. The discussion scenarios did not reflect real-life situations, so facilitation was never rehearsed in a sufficiently challenging atmosphere.\n\n• The key contents of Time Out needed to fit into roughly 2–3 hours, the average time organisations had available.\n\n• The training needed to be more lightweight overall.",layout:"text-only",images:[]},{heading:"What was designed",body:"• Game modes for building good dialogue, including monitoring and analysing discussion dynamics.\n\n• Facilitator's guide cards for steering the discussion, holding the key content of Time Out dialogue in a concise form.\n\n• Conversation style cards: green cards for building good dialogue, red cards for creating friction and challenge, specifically to support facilitation practice.\n\n• Citizen cards, bringing more diversity into the discussion and letting participants understand and present the perspectives that arise from people's backgrounds or values.\n\n• Role cards to shift mindset, prompting a more comprehensive examination of the topic and disrupting the traditional discussion dynamics of established groups such as a board of directors.",layout:"text-only",images:[]}]}},
];

function loadData() {
  try { const s = localStorage.getItem('portfolio_data'); if (s) return JSON.parse(s); }
  catch(e) {}
  return null;
}

function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function placeholder(label, hue) {
  const c1 = `hsl(${hue}, 65%, 70%)`;
  const c2 = `hsl(${(hue+30)%360}, 60%, 55%)`;
  return `<div class="ph" style="background:linear-gradient(135deg,${c1},${c2});">
    <span>${escapeHtml(label || 'image')}</span>
  </div>`;
}

function imgOrPh(url, label, hue) {
  if (url) return `<img src="${escapeHtml(url)}" alt="${escapeHtml(label||'')}" data-src="${escapeHtml(url)}" data-cap="${escapeHtml(label||'')}">`;
  return placeholder(label || 'image', hue);
}

const params = new URLSearchParams(location.search);
const id = params.get('id') || 'p1';

const data = loadData();
const projects = (data && data.projects) || DEFAULT_PROJECTS;
const project = projects.find(p => p.id === id) || projects[0];
const cs = project.caseStudy || (DEFAULT_PROJECTS[0].caseStudy);
const bioEmail = (data && data.bio && data.bio.email) || 'leena@markiet.studo';

document.title = `${project.title} — Leena Markiet`;
const hue = (project.cover && project.cover.hue) || 18;

// Pale washes sampled from the page's flowers, used as the plate behind case
// study art. They show through transparent PNGs and fill any gap a contained
// image leaves, so a screenshot never sits on a bare white rectangle.
const PLATES = [
  'linear-gradient(135deg,#FDF8EA,#F8F1DE)',  // poppy
  'linear-gradient(135deg,#F3F6FC,#E9EFFA)',  // forget-me-not
  'linear-gradient(135deg,#FCF4F7,#F7EAEF)',  // pink
  'linear-gradient(135deg,#F6F8EF,#EDF1E2)',  // stem sage
  'linear-gradient(135deg,#FAF6F0,#F4ECE1)',  // anemone
  'linear-gradient(135deg,#F7F5FD,#EFEBF9)',  // lilac
];

function renderBody(text) {
  const blocks = String(text).split(/\n\s*\n/).filter(b => b.trim());
  let html = '';
  let bullets = [];
  const flush = () => {
    if (!bullets.length) return;
    html += `<ul class="section-list">${bullets
      .map(b => `<li>${escapeHtml(b)}</li>`).join('')}</ul>`;
    bullets = [];
  };
  blocks.forEach(b => {
    const t = b.trim();
    if (t.startsWith('\u2022')) {
      bullets.push(t.replace(/^\u2022\s*/, ''));
    } else {
      flush();
      html += `<p class="section-body">${escapeHtml(t)}</p>`;
    }
  });
  flush();
  return html;
}

function renderSection(sec, i) {
  const layout = sec.layout || 'media-left';
  const imgs = sec.images || [];
  const main = imgs[0];
  const extras = imgs.slice(1);

  const headHTML = `
    <div class="section-head">
      <span class="section-num">0${i+1}</span>
      <h2 class="section-h2">${escapeHtml(sec.heading)}</h2>
    </div>`;

  // Bodies mix prose and bullet lines. Rendering bullets as a real list gives
  // control over the spacing between items — as one pre-wrapped paragraph, the
  // blank line separating bullets was the only spacing available, and too wide.
  const bodyHTML = sec.body ? renderBody(sec.body) : '';

  if (layout === 'text-only') {
    // Same grid as a media section, with the image cell left empty, so text-only
    // sections keep the identical column width instead of running full-bleed.
    return `<section class="section">${headHTML}
      <div class="layout-media layout-media-right"><div>${bodyHTML}</div><div></div></div>
    </section>`;
  }

  if (layout === 'gallery') {
    // Body stays in the shared text column; the images sit below it as a
    // full-width row, one column per image so a pair reads side by side.
    const items = imgs.map((im, j) => `
      <div>
        <div class="gallery-shot" style="--plate:${PLATES[(i + j + 1) % PLATES.length]}">${imgOrPh(im.url, im.label, hue + j*22)}</div>
        ${im.label ? `<div class="extra-cap" style="margin-top:8px;">${escapeHtml(im.label)}</div>` : ''}
      </div>`).join('');
    return `<section class="section">${headHTML}
      <div class="layout-media layout-media-right"><div>${bodyHTML}</div><div></div></div>
      <div class="gallery-grid" style="grid-template-columns:repeat(${Math.min(imgs.length,3)},1fr)">${items}</div>
    </section>`;
  }

  // media-left or media-right
  const mainHTML = main ? `
    <div>
      <div class="main-image-wrap" style="--plate:${PLATES[i % PLATES.length]}">${imgOrPh(main.url, main.label, hue)}</div>
      ${main.label ? `<div class="main-image-cap">${escapeHtml(main.label)}</div>` : ''}
    </div>` : '';

  const textHTML = `<div>${bodyHTML}</div>`;

  const mediaRow = layout === 'media-right'
    ? `<div class="layout-media layout-media-right">${textHTML}${mainHTML}</div>`
    : `<div class="layout-media layout-media-left">${mainHTML}${textHTML}</div>`;

  const extrasHTML = extras.length ? `
    <div class="extra-grid">
      ${extras.map((im, j) => `
        <div class="extra-item">
          <div class="extra-thumb" style="--plate:${PLATES[(i + j + 1) % PLATES.length]}">${imgOrPh(im.url, im.label, hue + (j+1)*30)}</div>
          ${im.label ? `<div class="extra-cap">${escapeHtml(im.label)}</div>` : ''}
        </div>`).join('')}
    </div>` : '';

  return `<section class="section">${headHTML}${main ? mediaRow
    : `<div class="layout-media layout-media-right"><div>${bodyHTML}</div><div></div></div>`}${extrasHTML}</section>`;
}

const sectionsHTML = (cs.sections || []).map(renderSection).join('');

// Related projects: pick the next ~3 projects after the current one (wrap around)
const TAG_PALETTES = [
  { bg:'rgba(195,204,155,0.45)', fg:'#546B41' },
  { bg:'rgba(245,225,195,0.70)', fg:'#7A5C2F' },
  { bg:'#E9E6F8',                fg:'#544A85' },
  { bg:'rgba(247,235,220,0.85)', fg:'#7A5C2F' },
  { bg:'#D9E4C7',                fg:'#546B41' },
  { bg:'#F7E3E9',                fg:'#8A5A66' },
  { bg:'#E3EAF8',                fg:'#43587A' },
  { bg:'#EFE6D6',                fg:'#5C3A0F' },
];
function relatedTagColor(tag) {
  let h = 0; for (let i = 0; i < tag.length; i++) h = (h*31 + tag.charCodeAt(i)) >>> 0;
  return TAG_PALETTES[h % TAG_PALETTES.length];
}
function pickRelated(all, currentId, n) {
  const idx = all.findIndex(p => p.id === currentId);
  if (idx < 0) return all.slice(0, n);
  const rest = [...all.slice(idx + 1), ...all.slice(0, idx)];
  return rest.slice(0, Math.min(n, rest.length));
}
const relatedProjects = pickRelated(projects, project.id, 3);
// Must stay identical to index.html's COVERS, and be indexed by the project's
// position in the project list rather than its position in this related grid,
// so a project keeps the same cover colour on both pages.
const COVERS = [
  'linear-gradient(135deg,#FEF6E7,#FAEAD0)',  // poppy
  'linear-gradient(135deg,#EDF2FB,#DCE7F7)',  // forget-me-not
  'linear-gradient(135deg,#F1F5E9,#E2EAD5)',  // stem sage
  'linear-gradient(135deg,#FCF2F5,#F7E4EB)',  // pink
  'linear-gradient(135deg,#FDF8F1,#F7EEE1)',  // blush
  'linear-gradient(135deg,#F5F2FC,#E9E4F7)',  // lilac
  'linear-gradient(135deg,#FAF4EE,#F2E5D8)',  // anemone
  'linear-gradient(135deg,#E6EDDA,#D2DDBC)',  // deep sage
];

function relatedCardHTML(p) {
  const i = projects.findIndex(x => x.id === p.id);
  const cover = (p.cover && p.cover.imageUrl)
    ? `<img src="${escapeHtml(p.cover.imageUrl)}" alt="${escapeHtml(p.cover.label||p.title)}">`
    : `<div style="position:absolute;inset:0;background:${COVERS[(i < 0 ? 0 : i) % COVERS.length]};"></div>
       <div class="ph-gr"><span>${escapeHtml((p.cover && p.cover.label) || p.title)}</span></div>`;
  return `
    <a class="related-card" href="article.html?id=${encodeURIComponent(p.id)}">
      <div class="related-cover">
        ${cover}
        <span class="ph-yr">${escapeHtml(p.year || '')}</span>
      </div>
      <div class="related-body">
        <h3 class="related-title">${escapeHtml(p.title)}</h3>
        <div class="related-tags">
          ${(p.tags || []).slice(0, 3).map(t => {
            const c = relatedTagColor(t);
            return `<span class="related-tag" style="background:${c.bg};color:${c.fg};">${escapeHtml(t)}</span>`;
          }).join('')}
        </div>
      </div>
    </a>`;
}

const relatedHTML = relatedProjects.length ? `
  <section class="related">
    <div class="related-head">

// Lightbox wiring — any <img data-src="..."> becomes clickable
const lb = document.getElementById('lb');
const lbImg = document.getElementById('lb-img');
const lbCap = document.getElementById('lb-cap');
function openLB(src, cap) {
  lbImg.src = src;
  lbCap.textContent = cap || '';
  lbCap.style.display = cap ? 'block' : 'none';
  lb.classList.add('show');
  document.body.style.overflow = 'hidden';
}
function closeLB() {
  lb.classList.remove('show');
  document.body.style.overflow = '';
  setTimeout(() => { lbImg.src = ''; }, 200);
}
window.closeLB = closeLB;
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLB(); });
document.querySelectorAll('img[data-src]').forEach(img => {
  img.style.cursor = 'zoom-in';
  img.addEventListener('click', (e) => {
    e.stopPropagation();
    openLB(img.dataset.src, img.dataset.cap);
  });
});
// Also clicking on any wrapper that has an image should open it
document.querySelectorAll('.main-image-wrap, .extra-thumb, .gallery-shot, .hero-img').forEach(w => {
  w.addEventListener('click', (e) => {
    const img = w.querySelector('img[data-src]');
    if (img) { e.stopPropagation(); openLB(img.dataset.src, img.dataset.cap); }
  });
});
</script>
