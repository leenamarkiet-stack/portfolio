        <style>
            :root { --cream:#F7EBDC; --yellowBloom:#FBEFC6; --tanBloom:#F5E1C3;
                    --ink:#1F1A14; --stem:#7C8C6E; --stemDeep:#546B41; --paper:#FFFAF0; }
            *,*::before,*::after { box-sizing: border-box; }
            html, body { margin:0; padding:0; height:100%; overflow-x:hidden; }
            .staticrypt-body {
                background: var(--cream);
                color: var(--ink);
                font-family: Inter, system-ui, sans-serif;
                min-height:100vh; position:relative; overflow:hidden;
            }
            /* Falling blooms. Two nested elements so the motion reads as a fall
               rather than a slide: the wrapper carries the constant descent, the
               image inside it sways and turns on its own, slower cycle. One
               element doing both would lock the sway to the fall and repeat
               visibly. Each is given its own duration, delay, drift and size
               through custom properties, so no two follow the same path. */
            .gate-fall { position:absolute; top:0; pointer-events:none; z-index:0;
                animation: gate-drop var(--dur,26s) linear var(--delay,0s) infinite;
                will-change: transform; }
            .gate-fall img { display:block; width:100%; height:auto;
                animation: gate-sway calc(var(--dur,26s) / 3.5) ease-in-out infinite alternate;
                animation-delay: var(--delay,0s);
                filter: drop-shadow(0 10px 20px rgba(31,26,20,0.10)); }
            @keyframes gate-drop {
                0%   { transform: translate3d(0,-30vh,0); opacity:0; }
                7%   { opacity: var(--op,0.9); }
                90%  { opacity: var(--op,0.9); }
                100% { transform: translate3d(var(--dx,40px),112vh,0); opacity:0; }
            }
            @keyframes gate-sway {
                from { transform: translateX(calc(var(--sway,18px) * -1)) rotate(var(--r0,-10deg)); }
                to   { transform: translateX(var(--sway,18px)) rotate(var(--r1,12deg)); }
            }
            /* The dandelion the seeds come off. It stays put and breathes; only
               its fluff travels. */
            .gate-dandelion { position:absolute; top:-18px; left:2vw; width:132px;
                pointer-events:none; z-index:0; opacity:.92;
                transform-origin: 50% 0%;
                animation: gate-nod 22s ease-in-out infinite;
                filter: drop-shadow(0 10px 20px rgba(31,26,20,0.10)); }
            .gate-dandelion img { display:block; width:100%; height:auto; transform: rotate(180deg); }
            @keyframes gate-nod {
                0%,100% { transform: rotate(-2.5deg); }
                50%     { transform: rotate(2.5deg); }
            }
            @media (prefers-reduced-motion: reduce) {
                .gate-fall, .gate-fall img, .gate-dandelion { animation: none; }
                .gate-fall { opacity: var(--op,0.9); transform: translateY(var(--rest,30vh)); }
            }
            .gate-blob { position:absolute; pointer-events:none; z-index:0; filter: blur(60px); }
            .gate-blob-1 { top:-110px; right:-60px; width:430px; height:370px; background:var(--yellowBloom);
                border-radius:58% 42% 63% 37% / 47% 53% 44% 56%; opacity:.9; }
            .gate-blob-2 { bottom:-140px; left:120px; width:420px; height:360px; background:var(--tanBloom);
                border-radius:44% 56% 38% 62% / 55% 40% 60% 45%; opacity:.55; }

            .staticrypt-page { position:relative; z-index:1;
                min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
            .staticrypt-form { width:100%; max-width:430px; text-align:center; }
            .gate-mark { display:block; width:100%; max-width:430px; height:auto; margin:0 auto 10px; }
            /* Same Lora line that sits under the name on the front page, so the
               gate introduces her the way the portfolio itself does. */
            .gate-role { font-family:"Lora", Georgia, serif; font-weight:500;
                font-size:20px; line-height:1.2; color:#3A332C; margin:0 0 26px; }
            .staticrypt-instructions { margin-bottom:26px; }
            /* the wordmark above already carries the name */
            .staticrypt-title { display:none; }
            .staticrypt-instructions p:not(.staticrypt-title) { margin:0; font-size:15px; line-height:1.55; color:#4A423A; }
            .staticrypt-hr { display:none; }

            .staticrypt-password-container { position:relative; }
            #staticrypt-password { width:100%; font-family:inherit; font-size:15px;
                padding:13px 46px 13px 16px; border-radius:10px; color:var(--ink);
                background:var(--paper); border:1px solid rgba(31,26,20,0.16); outline:none;
                transition:border-color .15s, box-shadow .15s; }
            #staticrypt-password:focus { border-color:var(--stem);
                box-shadow:0 0 0 3px rgba(124,140,110,0.20); }
            .staticrypt-toggle-password-visibility { position:absolute; right:14px; top:50%;
                transform:translateY(-50%); width:19px; opacity:.4; cursor:pointer; }
            .staticrypt-toggle-password-visibility:hover { opacity:.75; }

            .staticrypt-remember { display:flex; align-items:center; justify-content:center;
                gap:8px; margin-top:14px; font-size:13px; color:#4A423A; }
            .staticrypt-decrypt-button { width:100%; margin-top:18px; cursor:pointer;
                font-family:inherit; font-size:14px; font-weight:500; letter-spacing:.03em;
                padding:13px 18px; border:0; border-radius:999px; color:var(--paper);
                background:linear-gradient(135deg,var(--stem),var(--stemDeep));
                box-shadow:0 8px 20px -8px rgba(84,107,65,0.45);
                transition:transform .15s, box-shadow .15s; }
            .staticrypt-decrypt-button:hover { transform:translateY(-1px);
                box-shadow:0 12px 26px -10px rgba(84,107,65,0.55); }

            .staticrypt-spinner-container { min-height:100vh; display:flex; align-items:center; justify-content:center; }
            .staticrypt-spinner { width:32px; height:32px; border-radius:50%;
                border:3px solid rgba(84,107,65,0.20); border-top-color:var(--stemDeep);
                animation: gate-spin .9s linear infinite; }
            @keyframes gate-spin { to { transform: rotate(360deg); } }
            .hidden { display:none !important; }

            @media (min-width:900px) {
                .staticrypt-form { max-width:560px; }
                .gate-mark { max-width:560px; }
                .gate-role { font-size:25px; }
            }
            @media (max-width:560px) {
                .gate-role { font-size:17px; }
                /* A phone screen is a narrow corridor; the same fourteen falling
                   pieces read as clutter across the form. Thin them and shrink
                   what is left. */
                .gate-fall-extra { display:none; }
                .gate-dandelion { width:92px; left:-2vw; }
                .staticrypt-title { font-size:25px; }
            }
        </style>

        <script>

                rememberExpirationKey: "staticrypt_expiration",
                rememberPassphraseKey: "staticrypt_passphrase",
                replaceHtmlCallback: null,
                clearLocalStorageCallback: null,
            };

            // init the staticrypt engine
            const staticrypt = staticryptInitiator.init(staticryptConfig, templateConfig);

            // try to automatically decrypt on load if there is a saved password
            window.onload = async function () {
                const { isSuccessful } = await staticrypt.handleDecryptOnLoad();

                // if we didn't decrypt anything on load, show the password prompt. Otherwise the content has already been
                // replaced, no need to do anything
                if (!isSuccessful) {
                    // hide loading screen
                    document.getElementById("staticrypt_loading").classList.add("hidden");
                    document.getElementById("staticrypt_content").classList.remove("hidden");
                    document.getElementById("staticrypt-password").focus();
