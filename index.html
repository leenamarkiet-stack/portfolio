    25%  { transform: rotate(75deg) translateX(0) translateY(-6px); }

    100% { transform: rotate(72deg) translateX(-14px) translateY(-2px); }
  }

    25%  { transform: rotate(20deg) translateX(0) translateY(-3px); }
    50%  { transform: rotate(21deg) translateX(6px) translateY(-1px); }
    75%  { transform: rotate(20deg) translateX(0) translateY(-3px); }
    100% { transform: rotate(19deg) translateX(-6px) translateY(-1px); }
  }
  /* Pure horizontal-only motion — no rotation delta, since rotating a long
     420px shape around a near-end pivot creates an arc with real vertical
     displacement at the far tip, which read as "moving up and down". */
  @keyframes flowerSwayFooter {
    0%   { transform: translateX(-18px) rotate(100deg); }
    50%  { transform: translateX(18px) rotate(100deg); }
    100% { transform: translateX(-18px) rotate(100deg); }

  .hero-flower-pansy { animation: flowerSwayPansy 22s ease-in-out infinite; transform-origin: 50% 85%; }
  .footer-flower { animation: flowerSwayFooter 24s ease-in-out infinite; transform-origin: 50% 85%; }

  /* Individual dandelion seeds drift independently — direction/duration set per-seed via CSS vars */
  @keyframes seedFloat {
    0%   { transform: translate(0,0) rotate(0deg); }
    50%  { transform: translate(calc(var(--fx,8) * 1px), calc(var(--fy,-8) * 1px)) rotate(7deg); }
    100% { transform: translate(0,0) rotate(0deg); }
  }
  .dandelion-seed {
    position: absolute; pointer-events: none;
    animation: seedFloat var(--dur,12s) ease-in-out infinite;
    animation-delay: var(--delay,0s);
  }
  /* Whole cluster gets a slow idle bob too, on top of each seed's own float */
  @keyframes dandelionDrift {
    0%   { margin-top: 0px; }
    50%  { margin-top: -10px; }
    100% { margin-top: 0px; }
  }

  /* The puff head itself gently sways too, independent of the seeds and the cluster bob */
  @keyframes puffSway {
    0%   { transform: rotate(-2.5deg); }
    50%  { transform: rotate(2.5deg); }
    100% { transform: rotate(-2.5deg); }

  /* Scroll reveal: elements fade + slide up into place as they enter the viewport */
  .reveal {

const MONTHS_SHORT = ['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function expDate(m, y) {
  if (!y) return '—';
  return (m ? MONTHS_SHORT[m] + ' ' : '') + y;
}

// Lowercases a role string except acronyms (all-caps tokens like "UX/UI"),
// and capitalizes the very first letter of the result.
function formatRole(role) {
  const words = (role || '').split(' ').map(w => {
    const letters = w.replace(/[^A-Za-z]/g, '');
    const isAcronym = letters.length > 1 && letters === letters.toUpperCase();
    return isAcronym ? w : w.toLowerCase();
  });
  const joined = words.join(' ');
  return joined.charAt(0).toUpperCase() + joined.slice(1);
}

// True only for the admin (signed in via /admin.html). Drag-to-reorder is
// gated on this so visitors can't shuffle cards on the public site.
function isAdminSignedIn() {
  try { return localStorage.getItem('admin_auth') === '1'; } catch(e) { return false; }
}

// Fires once when the element scrolls into view; used to trigger the
// fade+slide-up "reveal" animation on scroll instead of on page load.
function useInView(options) {
  const ref = React.useRef(null);
  const [visible, setVisible] = React.useState(false);
  React.useEffect(() => {
    const el = ref.current;
    if (!el) return;
    if (typeof IntersectionObserver === 'undefined') { setVisible(true); return; }
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) { setVisible(true); io.unobserve(e.target); } });
    }, { threshold: 0.15, rootMargin: '0px 0px -40px 0px', ...options });
    io.observe(el);
    return () => io.disconnect();
  }, []);
  return [ref, visible];
}

function Reveal({children, delay = 0, as: Tag = 'div', className = '', style = {}}) {
  const [ref, visible] = useInView();
  return (
    <Tag ref={ref} className={`reveal ${visible ? 'reveal-visible' : ''} ${className}`}
      style={{...style, transitionDelay: visible ? `${delay}ms` : '0ms'}}>
      {children}
    </Tag>
  );
}

function useReorderable(initial, key) {
  const ids = initial.map(i=>i.id);
  const [order, setOrder] = React.useState(() => {
    try { const s=localStorage.getItem(key); if(s){const p=JSON.parse(s);if(p.length===ids.length&&ids.every(id=>p.includes(id)))return p;} } catch(e){}
    return ids;
  });
  React.useEffect(()=>{ try{localStorage.setItem(key,JSON.stringify(order));}catch(e){} },[order]);
  const items = React.useMemo(()=>{const m=new Map(initial.map(i=>[i.id,i]));return order.map(id=>m.get(id)).filter(Boolean);},[initial,order]);
  const [dragId,setDragId]=React.useState(null);
  const [overId,setOverId]=React.useState(null);
  const adminOn = isAdminSignedIn();
  const dragProps = (id) => {
    if (!adminOn) return { 'data-drag-state':'' };  // visitors get no drag handlers
    return ({
      draggable:true,
      onDragStart:(e)=>{setDragId(id);e.dataTransfer.effectAllowed='move';},
      onDragOver:(e)=>{e.preventDefault();if(id!==overId)setOverId(id);},
      onDrop:(e)=>{e.preventDefault();if(!dragId||dragId===id){setDragId(null);setOverId(null);return;}
        setOrder(prev=>{const n=[...prev],from=n.indexOf(dragId),to=n.indexOf(id);if(from<0||to<0)return prev;n.splice(from,1);n.splice(to,0,dragId);return n;});
        setDragId(null);setOverId(null);},
      onDragEnd:()=>{setDragId(null);setOverId(null);},
      'data-drag-state':dragId===id?'dragging':(overId===id&&dragId?'over':''),
    });
  };
  return {items,dragProps,adminOn};
}

// Smooth wheel-to-horizontal scroll: attach a wheel listener to a host element
// (e.g. the entire hero) and forward vertical wheel into smooth horizontal
// scroll on a target element resolved on each event (so it can pick the
// compact vs full timeline depending on state).
function useHostWheelToHorizontal(hostRef, getTargetEl, deps) {
  React.useEffect(() => {
    const host = hostRef.current;
    if (!host) return;
    let activeEl = null;
    let target = 0;
    let raf = null;
    const animate = () => {
      if (!activeEl) { raf = null; return; }
      const cur = activeEl.scrollLeft;
      const diff = target - cur;
      if (Math.abs(diff) < 0.5) {
        activeEl.scrollLeft = target;
        raf = null;
        return;
      }
      // ease-out toward target
      activeEl.scrollLeft = cur + diff * 0.16;
      raf = requestAnimationFrame(animate);
    };
    const onWheel = (e) => {
      const t = getTargetEl();
      if (!t) return;
      // re-sync when target changes or user has scrolled it via other means
      if (activeEl !== t) { activeEl = t; target = t.scrollLeft; }
      if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
      const max = t.scrollWidth - t.clientWidth;
      const canRight = target < max - 1;
      const canLeft  = target > 0;
      if ((e.deltaY > 0 && canRight) || (e.deltaY < 0 && canLeft)) {
        e.preventDefault();
        target = Math.max(0, Math.min(max, target + e.deltaY * 0.9));
        if (!raf) raf = requestAnimationFrame(animate);
      }
    };
    host.addEventListener('wheel', onWheel, { passive: false });
    return () => {
      host.removeEventListener('wheel', onWheel);
      if (raf) cancelAnimationFrame(raf);
    };
  }, deps || []);
}

// Tag a scroll container with data-at-start / data-at-end so CSS can drop the
// edge fade when you've scrolled to that edge. Updates on scroll + resize.
function useScrollEdgeAttrs(ref, deps) {
  React.useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const update = () => {
      const max = Math.max(0, el.scrollWidth - el.clientWidth);
      el.dataset.atStart = (el.scrollLeft <= 1) ? 'true' : 'false';
      el.dataset.atEnd   = (max <= 1 || el.scrollLeft >= max - 1) ? 'true' : 'false';
    };
    update();
    el.addEventListener('scroll', update, { passive: true });
    window.addEventListener('resize', update);
    // Re-check after layout settles in (custom fonts, late content)
    const t = setTimeout(update, 100);
    return () => {
      el.removeEventListener('scroll', update);
      window.removeEventListener('resize', update);
      clearTimeout(t);
    };
  }, deps || []);
}

          <path filter="url(#wc-blur2)" opacity="0.62" fill={P.cream}
            d="M0,58 C20,48 35,64 60,56 C130,32 155,72 200,58
               C255,40 270,66 305,60 C330,56 340,64 365,62
               C440,52 460,24 510,50 C545,68 560,58 590,54
               C660,44 680,72 730,58 C760,50 775,60 800,58
               C875,50 895,28 940,52 C970,68 985,60 1015,56
               C1080,46 1100,70 1150,58 C1185,50 1200,60 1230,56
               C1300,46 1325,66 1380,54 C1405,48 1420,58 1440,52 L1440,100 L0,100 Z"/>
          {/* front — sets the true boundary; irregular jab-and-sweep bristle marks */}
          <path filter="url(#wc-blur2)" fill={P.cream}
            d="M0,72 C15,66 25,76 45,70 C90,56 105,82 140,72
               C165,64 175,74 195,72 C260,64 285,42 320,68
               C345,86 365,74 390,72 C420,68 435,80 460,74
               C520,60 545,88 590,72 C615,62 630,76 655,74
               C695,68 715,52 750,70 C775,84 790,72 815,70
               C860,64 880,50 915,68 C935,80 950,72 970,70

               C1365,64 1385,52 1420,66 C1432,71 1436,68 1440,70

          {/* scattered drip blobs, uneven placement like real paint bleeding down */}

          <ellipse cx="605" cy="88" rx="4.5" ry="8" fill={P.cream} opacity="0.8" filter="url(#wc-blur2)"/>

      {/* Dandelion sits outside hero-pad's clipped bounds, so its fluff can drift

      <DandelionCluster className="hero-flower-dandelion dandelion-drift"

// ───── Visitor gate ─────
async function sha256Hex(s){
  const b=new TextEncoder().encode(s);const h=await crypto.subtle.digest('SHA-256',b);
  return Array.from(new Uint8Array(h)).map(x=>x.toString(16).padStart(2,'0')).join('');
}
function VisitorGate({onPass}){
  const [pw,setPw]=React.useState('');
  const [err,setErr]=React.useState('');
  const submit=async(e)=>{
    e.preventDefault();
    const cfg=window.SITE_CONFIG||{};
    const expected=cfg.visitorHash||'';
    const h=await sha256Hex(pw);
    if(h===expected){
      sessionStorage.setItem('visitor_auth','1');
      onPass();
    }else setErr('Wrong password.');
  };
  return (
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',
      padding:20,background:`linear-gradient(135deg,${P.cream} 0%,${P.peach} 60%,${P.coral} 100%)`}}>
      <div style={{width:'100%',maxWidth:380,background:P.paper,borderRadius:14,padding:32,
        boxShadow:'0 20px 60px -20px rgba(0,0,0,0.25)'}}>
        <h1 style={{fontFamily:SERIF,fontWeight:400,fontSize:32,margin:'0 0 8px',letterSpacing:'-0.01em'}}>Welcome</h1>
        <p style={{margin:'0 0 24px',color:'rgba(31,26,20,0.6)',fontSize:13}}>Enter password to view this portfolio.</p>
        <form onSubmit={submit}>
          <input type="password" value={pw} onChange={e=>setPw(e.target.value)} placeholder="Password" autoFocus
            style={{width:'100%',padding:'11px 14px',borderRadius:8,border:`1px solid ${P.ink}1f`,
              fontFamily:'inherit',fontSize:14,outline:'none'}}/>
          {err && <div style={{color:P.red,fontSize:12,marginTop:10}}>{err}</div>}
          <button type="submit" style={{width:'100%',marginTop:14,padding:12,border:0,borderRadius:999,
            background:`linear-gradient(135deg,${P.coral},${P.red})`,color:P.paper,
            fontFamily:'inherit',fontSize:14,fontWeight:500,cursor:'pointer',
            boxShadow:`0 8px 20px -8px ${P.red}90`}}>Enter</button>
        </form>
      </div>
    </div>
  );
}
function Root(){
  const cfg=window.SITE_CONFIG||{};
  const needGate = !!(cfg.visitorProtect && cfg.visitorHash);
  const [authed,setAuthed]=React.useState(!needGate || sessionStorage.getItem('visitor_auth')==='1');
  if(!authed) return <VisitorGate onPass={()=>setAuthed(true)}/>;
  return <Portfolio/>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Root/>);
</script>
